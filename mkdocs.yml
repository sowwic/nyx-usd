site_name: nyx-usd Documentation
site_description: Documentation for nyx-usd.
site_author: Dima Shevchenko
theme:
  name: material

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - tables

plugins:
  - search
  - mkdocs-autoapi:
      autoapi_dir: "src/nyx_usd"
      autoapi_ignore:
        - "**/version.py"
        
        - "**/resources/*"
        - "**/main.py"
      autoapi_file_patterns:
        - "*.py"
  - mkdocstrings:
      handlers:
        python:
          paths: ["src/nyx_usd"]
          options:
            docstring_style: google
            show_signature: true
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_category_heading: true
            merge_init_into_class: true
            show_if_no_docstring: true
  - autorefs

nav:
  - Home: index.md
  - User Guide:
      - user/index.md
      - Installation: user/installation.md
      - Starting a client: user/starting-a-client.md
      - Using the nodes: user/graphs.md
      - Nodes:
          - user/nodes/index.md
          - Stages: user/nodes/stages.md
          - Prims: user/nodes/prims.md
          - Attributes: user/nodes/attributes.md
          - Stage settings: user/nodes/stage-settings.md
          - Composition: user/nodes/composition.md
          - Transforms, geometry, shading: user/nodes/geometry.md
  - Developer Guide:
      - dev/index.md
      - Architecture: dev/architecture.md
      - Adding an operation: dev/adding-operations.md
      - Testing: dev/testing.md
      - Releasing: dev/releasing.md
